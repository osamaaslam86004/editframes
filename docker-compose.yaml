version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: editframes_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: editframes_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./videos:/app/videos
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis

  worker:
    build: .
    container_name: editframes_celery_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./videos:/app/videos
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis